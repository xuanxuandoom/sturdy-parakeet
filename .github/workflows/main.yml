name: Meh

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
         
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "mkas.1234$"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
         
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
         
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
         
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
         
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
         
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify Development Tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Rust ==="
          rustc --version
          cargo --version
          rustup show

          Write-Host "`n=== Git ==="
          git --version

          Write-Host "`n=== GitHub CLI ==="
          gh --version

          Write-Host "`n=== MSVC ==="
          $msvcLink = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\2022" `
            -Filter "link.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\Hostx64\\x64\\link\.exe$" } |
            Select-Object -First 1

          if (-not $msvcLink) {
              throw "MSVC x64 linker not found"
          }

          Write-Host "MSVC linker: $($msvcLink.FullName)"

          Write-Host "`n=== Environment ready ==="

      - name: Install WezTerm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install wezterm -y --no-progress

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path", "User")

          $wezterm = Get-Command wezterm.exe -ErrorAction SilentlyContinue

          if (-not $wezterm) {
              throw "WezTerm installation failed."
          }

          Write-Host "WezTerm installed:"
          & $wezterm.Source --version

      - name: Configure WezTerm
        shell: powershell
        run: |
          $configDir = "C:\ProgramData\WezTerm"
          $configPath = "$configDir\wezterm.lua"

          New-Item -ItemType Directory -Path $configDir -Force | Out-Null

          $configLines = @(
              "local wezterm = require 'wezterm'"
              ""
              "local config = wezterm.config_builder()"
              ""
              'config.front_end = "WebGpu"'
              'config.webgpu_force_fallback_adapter = true'
              ""
              "return config"
          )

          Set-Content `
            -Path $configPath `
            -Value $configLines `
            -Encoding UTF8

          [Environment]::SetEnvironmentVariable(
              "WEZTERM_CONFIG_FILE",
              $configPath,
              "Machine"
          )

          $env:WEZTERM_CONFIG_FILE = $configPath

          Write-Host "WezTerm config: $configPath"
          Write-Host "WEZTERM_CONFIG_FILE: $env:WEZTERM_CONFIG_FILE"

          Get-Content $configPath

      - name: Install OpenCode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Node.js / npm ==="
          node --version
          npm --version

          Write-Host "`n=== Installing OpenCode ==="
          npm install -g @opencode/cli

          Write-Host "`n=== Verifying OpenCode ==="
          $opencode = Get-Command opencode.exe -ErrorAction SilentlyContinue

          if (-not $opencode) {
              $opencode = Get-Command opencode -ErrorAction SilentlyContinue
          }

          if (-not $opencode) {
              throw "OpenCode installation failed: opencode command not found."
          }

          Write-Host "OpenCode: $($opencode.Source)"
          & $opencode.Source --version

          # Refresh PATH after the installer.
          $env:Path = `
            [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
            [Environment]::GetEnvironmentVariable("Path", "User")
            
      - name: Install Codex CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing Codex CLI ==="

          # Determine the exact current Codex version.
          $codexVersion = npm view @openai/codex version

          if (-not $codexVersion) {
              throw "Could not determine latest Codex version."
          }

          Write-Host "Codex version: $codexVersion"

          # Install the main package.
          npm install -g "@openai/codex@$codexVersion"

          # Explicitly install the Windows x64 native package.
          npm install -g `
            "@openai/codex-win32-x64@npm:@openai/codex@$codexVersion-win32-x64"

          # Find npm's global binary directory.
          $npmBin = npm prefix -g
          $npmBin = Join-Path $npmBin ""

          Write-Host "npm global prefix: $npmBin"

          # npm normally puts Windows command shims here.
          $npmGlobalBin = npm bin -g 2>$null

          if (-not $npmGlobalBin) {
              $npmGlobalBin = $npmBin
          }

          Write-Host "npm global bin: $npmGlobalBin"

          # Add npm's global location to this job's PATH.
          $env:Path = "$npmGlobalBin;$env:Path"

          # Also persist it for later GitHub Actions steps.
          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $npmGlobalBin

          Write-Host "`n=== Searching for Codex ==="

          $codexCommand = Get-Command codex.cmd -ErrorAction SilentlyContinue

          if (-not $codexCommand) {
              $codexCommand = Get-Command codex.exe -ErrorAction SilentlyContinue
          }

          if (-not $codexCommand) {
              $codexCommand = Get-Command codex -ErrorAction SilentlyContinue
          }

          if (-not $codexCommand) {
              Write-Host "PATH:"
              $env:Path -split ";" | ForEach-Object {
                  Write-Host "  $_"
              }

              Write-Host "`nSearching npm directories:"
              Get-ChildItem `
                -Path $env:APPDATA `
                -Filter "codex*" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 20 FullName

              throw "Codex command was not found after installation."
          }

          Write-Host "Codex found:"
          Write-Host $codexCommand.Source

          Write-Host "`n=== Codex version ==="
          & $codexCommand.Source --version
          
      - name: Configure Git For All User Profiles
        shell: powershell
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          $ErrorActionPreference = "Stop"

          $gitName = $env:GIT_NAME
          $gitEmail = $env:GIT_EMAIL

          Write-Host "Git name: $gitName"
          Write-Host "Git email: $gitEmail"

          $profiles = Get-ChildItem "C:\Users" -Directory -Force | Where-Object {
              $_.Name -notin @(
                  "Public",
                  "Default",
                  "Default User",
                  "All Users"
              )
          }

          foreach ($profile in $profiles) {
              Write-Host "`nConfiguring Git for: $($profile.FullName)"

              $gitConfig = Join-Path $profile.FullName ".gitconfig"

              @(
                  "[user]"
                  "    name = $gitName"
                  "    email = $gitEmail"
              ) | Set-Content -Path $gitConfig -Encoding UTF8

              Write-Host "Created: $gitConfig"
          }

          # Configure the current runner account as well.
          git config --global user.name "$gitName"
          git config --global user.email "$gitEmail"

          Write-Host "`n=== Git profile configurations ==="

          Get-ChildItem "C:\Users" -Directory -Force |
              ForEach-Object {
                  $gitConfig = Join-Path $_.FullName ".gitconfig"

                  if (Test-Path $gitConfig) {
                      Write-Host "FOUND: $gitConfig"
                  }
              }

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
         
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Credentials: $env:RDP_CREDS"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          if (-not (Test-Path $startupPath)) {
              New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
          }

          # Create WezTerm configuration without using a PowerShell here-string.
          $weztermConfigPath = "$rdpProfile\.wezterm.lua"

          $configLines = @(
              "local wezterm = require 'wezterm'"
              ""
              "local config = wezterm.config_builder()"
              ""
              'config.front_end = "WebGpu"'
              'config.webgpu_force_fallback_adapter = true'
              ""
              "return config"
          )

          Set-Content -Path $weztermConfigPath -Value $configLines -Encoding UTF8

          Write-Host "WezTerm config created:"
          Write-Host $weztermConfigPath

          Write-Host "`n=== WezTerm config ==="
          Get-Content $weztermConfigPath
          Write-Host "======================`n"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
              Write-Host "Downloads.bat copied successfully."

              cmd /c $downloadPath
              Write-Host "Downloads.bat executed successfully."
          }
          catch {
              Write-Host "Error: $($_.Exception.Message)"
          }

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
